name: Feature request
description: Suggest an improvement for outreach staff, program managers or administrators.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who runs into it, and when (in the van, at the office, at report time)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Would this store anything new about participants? Kitcount never stores names or free text.
