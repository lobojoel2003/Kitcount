name: Release

# Two ways to release:
#  - Push a tag vMAJOR.MINOR.PATCH (see scripts/release.sh).
#  - Run this workflow from the Actions tab on `main` with the tag to create,
#    e.g. v1.0.0. The tag must match /VERSION; it is created on the exact
#    commit that was built, and only after every artifact built successfully.
#    Running it for a tag that already exists rebuilds that tag.
# Either way every artifact is attested and published as a GitHub release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0 (must match /VERSION)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  IMAGE: ghcr.io/${{ github.repository_owner }}/kitcount-server

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.ref.outputs.exists }}
      version: ${{ steps.v.outputs.VERSION }}
      build: ${{ steps.v.outputs.BUILD }}
      commit: ${{ steps.v.outputs.COMMIT }}
      date: ${{ steps.v.outputs.DATE }}
    steps:
      - id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got '$TAG')"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the commit to build
        id: ref
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Building existing tag $TAG at $(git rev-parse HEAD)"
          elif [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Building main at $(git rev-parse HEAD); $TAG will be created when the release is published"
          else
            echo "::error::$TAG does not exist. Push the tag, or run this workflow on main to create it."; exit 1
          fi
      - id: v
        run: scripts/version.sh | tee -a "$GITHUB_OUTPUT"
      - name: Tag matches VERSION
        run: |
          if [ "${{ steps.meta.outputs.tag }}" != "v${{ steps.v.outputs.VERSION }}" ]; then
            echo "::error::Tag ${{ steps.meta.outputs.tag }} does not match VERSION file (v${{ steps.v.outputs.VERSION }})"
            exit 1
          fi
      - name: App package.json matches VERSION
        run: |
          pkg="$(node -p 'require("./app/package.json").version')"
          [ "$pkg" = "${{ steps.v.outputs.VERSION }}" ] || { echo "::error::app/package.json is $pkg"; exit 1; }
      - name: Release notes
        run: |
          {
            scripts/release-notes.sh "${{ steps.v.outputs.VERSION }}"
            cat <<EOF

          ## Downloads

          | Artifact | Use |
          | --- | --- |
          | \`kitcount-${{ steps.v.outputs.VERSION }}-build${{ steps.v.outputs.BUILD }}.apk\` | Android app — install directly on phones and tablets |
          | \`kitcount-${{ steps.v.outputs.VERSION }}-build${{ steps.v.outputs.BUILD }}.aab\` | Android App Bundle for Google Play |
          | \`kitcount-server_${{ steps.v.outputs.VERSION }}_<os>_<arch>\` | Sync server binaries (Linux, macOS, Windows) |
          | \`kitcount-web-demo-${{ steps.v.outputs.VERSION }}.zip\` | Static browser demo with synthetic data |
          | \`SHA256SUMS\` | Checksums for every file |

          **Docker:** \`docker pull ${{ env.IMAGE }}:${{ steps.v.outputs.VERSION }}\`

          Build ${{ steps.v.outputs.BUILD }} · commit \`${{ steps.v.outputs.COMMIT }}\`. Every artifact carries a
          [build provenance attestation](https://github.com/${{ github.repository }}/attestations); verify with
          \`gh attestation verify <file> --repo ${{ github.repository }}\`.
          EOF
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      skip-android: true
      ref: ${{ needs.prepare.outputs.commit }}

  server-binaries:
    name: Server · ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          v="${{ needs.prepare.outputs.version }}"
          name="kitcount-server_${v}_${GOOS}_${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name"
          (cd server && go build -trimpath -ldflags "-s -w \
            -X github.com/lobojoel2003/Kitcount/server/internal/version.Version=$v \
            -X github.com/lobojoel2003/Kitcount/server/internal/version.Build=${{ needs.prepare.outputs.build }} \
            -X github.com/lobojoel2003/Kitcount/server/internal/version.Commit=${{ needs.prepare.outputs.commit }} \
            -X github.com/lobojoel2003/Kitcount/server/internal/version.Date=${{ needs.prepare.outputs.date }}" \
            -o "../dist/$name/kitcount-server$ext" ./cmd/kitcount-server)
          cp server/LICENSE server/README.md "dist/$name/"
          cp deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
          ls -l
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  docker:
    name: Docker image → GHCR
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=kitcount-server
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD=${{ needs.prepare.outputs.build }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  android:
    name: Android · APK + App Bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      KITCOUNT_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
      KITCOUNT_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KITCOUNT_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key from repository secrets."
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set; the APK is signed with the debug key (fine for testing and sideloading, not for Google Play)."
          fi
      - name: Generate native project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build APK and App Bundle
        working-directory: app/android
        env:
          KITCOUNT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KITCOUNT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KITCOUNT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Collect
        run: |
          base="kitcount-${{ needs.prepare.outputs.version }}-build${{ needs.prepare.outputs.build }}"
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/$base.apk"
          cp app/android/app/build/outputs/bundle/release/app-release.aab "out/$base.aab"
          ls -l out
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*

  web:
    name: Web demo bundle
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run export:web
        working-directory: app
        env:
          KITCOUNT_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          KITCOUNT_COMMIT: ${{ needs.prepare.outputs.commit }}
      - run: |
          mkdir -p out
          (cd app/dist && zip -qr "../../out/kitcount-web-demo-${{ needs.prepare.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo
          path: out/*

  publish:
    name: Publish GitHub release
    needs: [prepare, ci, server-binaries, docker, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download only release assets (the run also holds CI coverage, smoke
      # screenshots and Docker build records, which must not be published).
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: web-demo
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: artifacts
      - name: Checksums
        working-directory: artifacts
        run: |
          ls -l
          sha256sum *.apk *.aab *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8 || { echo "::error::expected 8 release files"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # Creates the tag on the built commit when it does not exist yet.
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Kitcount ${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes.md
          make_latest: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
